    <script>
      // Safe guard against TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get() {
                return originalFetch;
              },
              set(val) {
                console.warn('Attempted to overwrite window.fetch, ignored to prevent crash.');
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.error('Error defining fetch setter guard:', e);
        }
      })();
